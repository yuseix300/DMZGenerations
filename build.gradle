plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.30'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    // Sets up SRG<->named mixin refmap remapping for the dev runtime. This is what makes
    // BOTH our own mixins AND DragonMineZ's mixins resolve when running runClient in dev.
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Registers our mixin config + refmap. Declaring at least one config here is what makes
// the mixin plugin inject the refmap-remapping args into the run tasks (fixes DMZ's
// mixins in dev too). Our own mixins (chibi model scaling, etc.) go in this config later.
mixin {
    add sourceSets.main, 'dmzgenerations.refmap.json'
    config 'dmzgenerations.mixins.json'
}

repositories {
    // DragonMineZ is published on the Modrinth Maven — this is the standard way DMZ
    // addons depend on it, and it deobfuscates cleanly (so mixins work in dev runClient).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // flatDir is only for the ALTERNATIVE local-jar path (testing against your own DMZ
    // build). Harmless when unused.
    flatDir { dirs 'libs' }

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'
    }
    mavenCentral()
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'fml.earlyprogresswindow', 'false'
            property 'geckolib.disable_examples', 'true'
            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client { }
        server { }
        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // --- DragonMineZ (mandatory parent mod) ---
    // Pulled from the Modrinth Maven — the standard way DMZ addons depend on it (this is
    // how other addons make it work in dev). fg.deobf deobfuscates it, so its mixins
    // resolve in the dev runClient. Coordinate: maven.modrinth:<project>:<version_number>
    // (dragonminez 2.1.3 == Modrinth version id yZ4DgZaE). Bump the version to target a
    // newer DMZ release.
    implementation fg.deobf("maven.modrinth:dragonminez:2.1.3")

    // ALTERNATIVE — compile/run against a LOCAL DMZ build (your own unreleased changes):
    // comment the line above, drop the jar as libs/dragonminez-${dmz_local_version}.jar,
    // and use the flatDir repo declared above with:
    //   implementation fg.deobf("dmzlocal:dragonminez:${project.dmz_local_version}")

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.8.3")
    implementation "com.eliotlash.mclib:mclib:20"
    implementation fg.deobf("com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.10")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
}

// Include the datagen output as a resource source set.
sourceSets.main {
    resources {
        srcDir 'src/generated/resources'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version           : project.minecraft_version,
            minecraft_version_range     : project.minecraft_version_range,
            forge_version               : project.forge_version,
            forge_version_range         : project.forge_version_range,
            loader_version_range        : project.loader_version_range,
            dragonminez_version_range   : project.dragonminez_version_range,
            geckolib_version_range      : project.geckolib_version_range,
            terrablender_version_range  : project.terrablender_version_range,
            curios_version_range        : project.curios_version_range,
            mod_id                      : project.mod_id,
            mod_name                    : project.mod_name,
            mod_license                 : project.mod_license,
            mod_version                 : project.mod_version,
            mod_authors                 : project.mod_authors,
            mod_credits                 : project.mod_credits,
            mod_description             : project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : project.mod_authors,
                'Specification-Version'   : project.mod_version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : project.mod_authors
        ])
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}
