###############################
###### GRADLE PROPERTIES ######
###############################
org.gradle.jvmargs=-Xmx4G
org.gradle.workers.max=2
# Left online so the first build can fetch anything not already cached by DragonMineZ.
org.gradle.offline=false

##########################
###### ENVIRONMENT #######
##########################
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# Dependency version ranges (must stay in sync with the DragonMineZ build)
dragonminez_version_range=[2.1.0,)

# Local DragonMineZ dev jar version — the jar in libs/ must be named
# dragonminez-<this>.jar (e.g. dragonminez-2.1.3.jar). Bump this when you drop a
# newer DMZ build. Used by flatDir to deobfuscate DMZ for compiling + dev runtime.
dmz_local_version=2.1.3
geckolib_version_range=[4.8.3,)
terrablender_version_range=[3.0.1.10,)
curios_version_range=[5.14.1+1.20.1,)

mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

#############################
###### MOD INFORMATION ######
#############################
mod_id=dmzgenerations
mod_name=DMZ: Generations
mod_license=All Rights Reserved
### mod_version follows the format: version.major.minor[.patch]-[tags]
mod_version=1.0.0
mod_group_id=com.yuseix300.dmzgenerations
mod_authors=Yuseix300
mod_credits=An addon for DragonMineZ.
mod_description=DMZ: Generations is an addon for DragonMineZ that extends the mod with new content.
