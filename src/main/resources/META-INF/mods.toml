modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''
displayTest="MATCH_VERSION"

[[mixins]]
config="dmzgenerations.mixins.json"

# ============================================================================
#  Dependencies
#  DragonMineZ and everything it needs are MANDATORY for this addon.
# ============================================================================

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# --- DragonMineZ: must load BEFORE this addon so its registries exist ---
[[dependencies.${mod_id}]]
    modId="dragonminez"
    mandatory=true
    versionRange="${dragonminez_version_range}"
    ordering="AFTER"
    side="BOTH"

# --- DragonMineZ's own dependencies (also required here) ---
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    mandatory=true
    versionRange="${terrablender_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"
